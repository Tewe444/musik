<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <title>Noten-Raum 3D – Tewe444</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-menu">
  <div id="stage">
    <div class="hud" id="coins">🪙 0</div>
    <div class="hud" id="msg">Sammle die fallenden Steinnoten und fülle den Takt!</div>
    <div class="hud" id="floorCount" style="right:12px;top:48px;text-align:right;font-size:.85rem;opacity:.88"></div>
    <div class="hud" id="cross"></div>
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <div id="timer"><span id="timerText">⏱ 90 s</span><div id="timerTrack"><div id="timerBar"></div></div></div>
    <button id="menuBtn" type="button">☰ Menü</button>
    <div id="tutorial" aria-live="polite"></div>
    <div id="toast" role="status"></div>
    <div id="menuScreen">
      <div class="menuBox">
        <h1>Noten-Raum 3D</h1>
        <p class="sub">Lege Noten auf den Tisch – zusammen genau 4 Schläge!</p>
        <button id="btnPlay" class="menuBtn primary" type="button">Spielen</button>
        <button id="btnTutorial" class="menuBtn" type="button">Tutorial</button>
        <div id="menuInfo"></div>
        <div class="menuCredits">Code: ChatGPT &amp; Claude · Musik: Gemini<br>Tewe444 · Waldorfschule Rostock</div>
      </div>
    </div>
    <button id="bookBack" type="button" hidden>← Zurück</button>
    <div id="touchControls" aria-hidden="false">
      <div id="joystickZone"><div id="joystickBase" aria-label="Bewegungs-Joystick"><div id="joystickKnob"></div></div></div>
      <button id="actionTouch" type="button" aria-label="Nehmen oder Werfen">Nehmen</button>
      <button id="jumpTouch" type="button" aria-label="Springen">↑</button>
    </div>
    <input id="musicFolderInput" type="file" accept=".mp3,audio/mpeg" multiple webkitdirectory directory hidden>
    <input id="musicFilesInput" type="file" accept=".mp3,audio/mpeg" multiple hidden>
  </div>
  <audio id="music" preload="auto"></audio>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
